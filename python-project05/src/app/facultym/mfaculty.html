<div class="min-vh-100 py-4 px-3 page-bg">
  <div class="mx-auto" style="max-width: 640px;">
    <div class="d-flex align-items-center gap-3 mb-4">
      <button class="btn btn-outline-light btn-sm" (click)="goBack()">&#8592; Back</button>
      <h1 class="h4 text-white fw-bold mb-0"> {{title}}</h1>
    </div>

    <div class="card shadow">
      <div class="card-body p-4">
        <form [formGroup]="form" (ngSubmit)="onSave()">
          <div class="mb-3">
            <label class="form-label fw-semibold">Faculty Name<span class="text-danger">*</span></label>
            <input type="text" formControlName="facultyName" class="form-control" />
          </div>

          <div class="row g-3 mb-3">
            <div class="col">
              <label class="form-label fw-semibold">Subject <span class="text-danger">*</span></label>
              <input type="text" formControlName="subject" class="form-control" />
            </div>
            <div class="col">
              <label class="form-label fw-semibold">Qualification <span class="text-danger">*</span></label>
              <input type="text" formControlName="qualification" class="form-control" />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Experience <span class="text-danger">*</span></label>
            <input type="number" formControlName="experience" class="form-control" />
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-success" [disabled]="saving || deleting">
              <i class="bi bi-floppy"></i> {{ saving ? 'Saving…' : 'Save' }}
            </button>
            @if (isEditMode) {
              <button type="button" class="btn btn-danger" (click)="onDelete()" [disabled]="saving || deleting">
                <i class="bi bi-trash"></i> {{ deleting ? 'Deleting…' : 'Delete' }}
              </button>
            }
            <button type="button" class="btn btn-secondary" (click)="goBack()" [disabled]="saving || deleting">
              <i class="bi bi-x-circle"></i> Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
